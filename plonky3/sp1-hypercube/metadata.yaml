description: 
  LLZK translations of the SP1 core circuits (written in Plonky3).
  Each file corresponds to a single SP1 chip (e.g., Add, Branch, KeccakPermute),
  generated from the SP1-Hypercube pipeline and emitted as LLZK IR. 
  Each LLZK file contains the chip translation. 
  If an LLZK file has multiple top-level structs then each struct corresponds to an opcode.

repository:
  name: "succinctlabs/sp1"
  url: https://github.com/code-423n4/2025-09-succinct/
  commit: df951c9a867a927f606465b08feeed88a96c9775
  branch: "main"

