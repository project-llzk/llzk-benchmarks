description:
  LLZK translations of the airbender ZKVM from zkSync.
  Each file corresponds to a single opcode circuit (V1), unrolled opcode
  circuit (Unrolled), or delegation (Delegation).
  Each LLZK file contains the circuit translation.

repository:
  name: "project-llzk/airbender-llzk-frontend"
  url: https://github.com/project-llzk/airbender-llzk-frontend
  commit: 0cd11020144c5c8ebf1527884ade569a340b92de
  branch: "llzk"

reproduction: |
  To reproduce the circuits, clone the frontend repository. Then, enter the nix shell:
  > nix develop
  Navigate to the `llzk_backend` directory:
  > cd llzk_backend
  Then run the llzk_backend extraction script:
  > cargo run -- gen-all-circuits --output output -f llzk
  All of the below circuits will then be available in `output/`

circuits:
